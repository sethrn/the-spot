<!DOCTYPE html>
<html>
<head>
    <title>Business Details</title>
    <script type="module" src="/static/business.js"></script>
</head>
<body>
    <h2>Edit Business</h2>

    <form id="businessDetailForm">
        <label>Name:</label>
        <input type="text" id="name"><br>

        <label>Address:</label>
        <input type="text" id="address"><br>

        <label>City:</label>
        <input type="text" id="city"><br>

        <label>State:</label>
        <input type="text" id="state"><br>

        <label>Postal Code:</label>
        <input type="text" id="postal_code"><br>

        <label>Latitude:</label>
        <input type="text" id="latitude"><br>

        <label>Longitude:</label>
        <input type="text" id="longitude"><br>

        <label>Is Open:</label>
        <select id="is_open">
            <option value="true">Yes</option>
            <option value="false">No</option>
        </select><br>

        <label>Attributes (JSON):</label>
        <textarea id="attributes" rows="3" cols="50"></textarea><br>

        <label>Categories (comma-separated):</label>
        <input type="text" id="categories"><br>

        <label>Hours (JSON):</label>
        <textarea id="hours" rows="3" cols="50"></textarea><br>

        <button type="button" onclick="updateBusiness()">Update</button>
        <button type="button" onclick="window.location.href='/manage'">Cancel</button>
    </form>
</body>
</html>
