<!DOCTYPE html>
<html>
<head>
    <title>Business Search</title>
    <script src="/static/session.js"></script>
    <script type="module" src="/static/user.js"></script>
</head>
<body>
    <h2>Search for Businesses</h2>

    <div>
        <label>Name:</label>
        <input type="text" id="nameInput">

        <label>State:</label>
        <select id="stateSelect">
            <option value="">All</option>
            <option value="AB">AB</option>
            <option value="AZ">AZ</option>
            <option value="CA">CA</option>
            <option value="CO">CO</option>
            <option value="DE">DE</option>
            <option value="FL">FL</option>
            <option value="HI">HI</option>
            <option value="ID">ID</option>
            <option value="IL">IL</option>
            <option value="IN">IN</option>
            <option value="LA">LA</option>
            <option value="MA">MA</option>
            <option value="MI">MI</option>
            <option value="MO">MO</option>
            <option value="MT">MT</option>
            <option value="NC">NC</option>
            <option value="NJ">NJ</option>
            <option value="NV">NV</option>
            <option value="PA">PA</option>
            <option value="SD">SD</option>
            <option value="TN">TN</option>
            <option value="TX">TX</option>
            <option value="UT">UT</option>
            <option value="VI">VI</option>
            <option value="VT">VT</option>
            <option value="WA">WA</option>
            <option value="XMS">XMS</option>
        </select>

        <label>Open:</label>
        <select id="openSelect">
            <option value="">All</option>
            <option value="true">Open Only</option>
        </select>

        <button onclick="searchBusinesses()">Search</button>
    </div>

    <hr>

    <div id="businessList" style="height: 70vh; overflow-y: scroll; border: 1px solid #ccc; padding: 10px;">

    </div>

    <div style="margin-top: 20px;">
        <button id="prevPageBtn">Previous</button>
        <span id="pageLabel">Page 1</span>
        <button id="nextPageBtn">Next</button>
    </div>
</body>
</html>
